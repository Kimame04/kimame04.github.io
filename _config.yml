# Site settings
title: Kieran Mendoza
email: mendozakyan@gmail.com
description: Software engineering, data systems, fluid dynamics research, and technical notes.
baseurl: ""
url: "https://kimame04.github.io"
github_username: Kimame04

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Permalinks for articles
permalink: /articles/:year/:month/:day/:title/

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

sass:
  style: compressed

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - scratch/
